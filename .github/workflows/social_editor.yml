name: Private Social Editor

on:
  schedule:
    # 07:30 Asia/Taipei. GitHub scheduling can be delayed.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-social-editor
  cancel-in-progress: false

jobs:
  candidate:
    if: vars.SOCIAL_EDITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Select and submit one candidate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOCIAL_EDITOR_URL: ${{ vars.SOCIAL_EDITOR_URL }}
          SOCIAL_EDITOR_JOB_TOKEN: ${{ secrets.SOCIAL_EDITOR_JOB_TOKEN }}
        run: python social/pipeline.py
